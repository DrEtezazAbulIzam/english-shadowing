<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam – احكي إنكليزي بالصوت</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#1d2427;--mute:#68727a;--line:#dfe6e3;--acc:#1f7a64;--acc2:#e3f2ec;--fix:#fff5df;--fixInk:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#121619;--card:#1c2226;--ink:#e9eeec;--mute:#93a0a6;--line:#2b3338;--acc:#55c7a6;--acc2:#1b2f29;--fix:#2e2716;--fixInk:#f0c46b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.en{direction:ltr;text-align:left;font-family:Nunito,system-ui,sans-serif}
.topics{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center}
#bot{width:150px;height:150px}
#status{font-size:.88rem;padding:2px 12px;border-radius:999px;background:var(--acc2);color:var(--acc);margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;width:100%}
#samLine{font-size:1.35rem;font-weight:700}
#samAr{color:var(--mute);font-size:.95rem;margin-top:4px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{border:0;background:var(--acc2);color:var(--acc);border-radius:12px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.main{background:var(--acc);color:#fff}
#mic{width:78px;height:78px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;cursor:pointer;box-shadow:0 6px 18px rgba(31,122,100,.35);margin:6px auto 4px;display:block}
#mic.on{background:#d9534f;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,83,79,.5)}70%{box-shadow:0 0 0 18px rgba(217,83,79,0)}100%{box-shadow:0 0 0 0 rgba(217,83,79,0)}}
.micLabel{text-align:center;color:var(--mute);font-size:.9rem}
#model{display:none;margin-top:10px;padding:10px;border-radius:12px;background:var(--bg)}
#model.show{display:block}
#fb{display:none}
#fb.show{display:block}
.w{display:inline-block;margin:2px 3px;padding:0 5px;border-radius:6px;font-family:Nunito,sans-serif}
.ok{background:#d6f0e3;color:#14583f}.bad{background:#f9d9d6;color:#8a2219;text-decoration:underline wavy}.miss{background:#f9d9d6;color:#8a2219;opacity:.75}
@media (prefers-color-scheme:dark){.ok{background:#1d3b31;color:#8fe0c0}.bad,.miss{background:#45221f;color:#ffb3aa}}
.score{font-size:1.4rem;font-weight:700}
.fix{background:var(--fix);color:var(--fixInk);border-radius:12px;padding:10px;margin-top:10px}
.fix .en{color:var(--ink);font-weight:700;font-size:1.1rem}
ul.tips{margin:8px 0 0;padding-inline-start:18px;text-align:right}
.prog{color:var(--mute);font-size:.85rem}
#warn{display:none;background:var(--fix);color:var(--fixInk);border-radius:12px;padding:10px;margin-bottom:12px}
label.sp{font-size:.85rem;color:var(--mute)}
#mouth{transform-origin:60px 82px}
.talking #mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
.eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#ear{opacity:0}.listening #ear{opacity:1;animation:glow 1s infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:1}}
#antenna{transform-origin:60px 22px}.talking #antenna{animation:wig .5s infinite alternate}
@keyframes wig{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="warn"></div>
  <div class="topics" id="topics"></div>
  <div class="stage">
    <svg id="bot" viewBox="0 0 120 120" aria-label="Sam">
      <g id="antenna"><line x1="60" y1="22" x2="60" y2="8" stroke="#3a4a52" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="7" r="5" fill="#ffb547"/></g>
      <rect x="10" y="44" width="10" height="26" rx="5" fill="#2c8a70"/><rect x="100" y="44" width="10" height="26" rx="5" fill="#2c8a70"/>
      <circle id="ear" cx="105" cy="57" r="11" fill="none" stroke="#ff6b6b" stroke-width="3"/>
      <rect x="18" y="22" width="84" height="80" rx="26" fill="#55c7a6"/><rect x="26" y="32" width="68" height="60" rx="20" fill="#203038"/>
      <ellipse class="eye" cx="46" cy="56" rx="7" ry="9" fill="#9ff3dc"/><ellipse class="eye" cx="74" cy="56" rx="7" ry="9" fill="#9ff3dc"/>
      <circle cx="35" cy="72" r="4" fill="#ff8fa3" opacity=".6"/><circle cx="85" cy="72" r="4" fill="#ff8fa3" opacity=".6"/>
      <ellipse id="mouth" cx="60" cy="80" rx="10" ry="5" fill="#9ff3dc"/>
    </svg>
    <div id="status">اضغط "ابدأ" 👇</div>

    <div class="card">
      <div class="prog" id="prog"></div>
      <div class="en" id="samLine" style="text-align:center"></div>
      <div id="samAr"></div>
      <div class="row">
        <button class="btn" id="again">🔊 عيد</button>
        <button class="btn" id="slow">🐢 ببطء</button>
        <button class="btn" id="showModel">💡 ساعدني بجواب</button>
      </div>
      <div id="model"><div class="en" id="modelTxt" style="text-align:center;font-weight:700"></div><div id="modelAr" style="color:var(--mute);font-size:.9rem"></div>
        <div class="row"><button class="btn" id="modelSay">🔊 اسمع الجواب</button></div></div>
    </div>

    <button id="mic" title="احكي">🎙️</button>
    <div class="micLabel" id="micLabel">اضغط واحكي جوابك بالإنكليزي</div>

    <div class="card" id="fb"></div>

    <div class="row">
      <button class="btn main" id="next">ابدأ ▶</button>
      <label class="sp">سرعة Sam <input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="0.85"></label>
    </div>
  </div>
</div>
<script>
const TOPICS = [{"name": "عن حالي 🙋", "turns": [{"sam": "Hi! I'm Sam. How are you today?", "ar": "مرحبا! أنا سام. كيفك اليوم؟", "model": "I'm fine, thank you. How about you?", "modelAr": "منيح، شكراً. وإنت؟"}, {"sam": "I'm great, thanks! Where are you from?", "ar": "منيح! من وين إنت؟", "model": "I'm from Syria. I live in Damascus.", "modelAr": "أنا من سوريا. ساكن بالشام."}, {"sam": "Nice! What do you do?", "ar": "حلو! شو بتشتغل؟", "model": "I'm a university student. I study accounting.", "modelAr": "أنا طالب جامعة. بدرس محاسبة."}, {"sam": "Cool! What year are you in?", "ar": "حلو! بأي سنة إنت؟", "model": "I'm in my fourth year.", "modelAr": "أنا بسنة رابعة."}, {"sam": "What time do you usually wake up?", "ar": "أيمتى بتفيق عادةً؟", "model": "I usually wake up at ten in the morning.", "modelAr": "عادةً بفيق الساعة عشرة الصبح."}, {"sam": "What do you like to do in your free time?", "ar": "شو بتحب تعمل بوقت فراغك؟", "model": "I like watching movies and going out with my friends.", "modelAr": "بحب اتفرج أفلام واطلع مع أصحابي."}, {"sam": "Why do you want to learn English?", "ar": "ليش بدك تتعلم إنكليزي؟", "model": "I want to work in a big company or travel abroad.", "modelAr": "بدي اشتغل بشركة كبيرة أو سافر برّا."}]}, {"name": "بالمطعم 🍽️", "turns": [{"sam": "Good evening! Welcome. How many people?", "ar": "مسا الخير! أهلاً. كم شخص؟", "model": "Just one, please.", "modelAr": "واحد بس، لو سمحت."}, {"sam": "Here's the menu. Are you ready to order?", "ar": "هي المنيو. جاهز تطلب؟", "model": "Yes. I'd like the chicken salad, please.", "modelAr": "إي. بدي سلطة الدجاج لو سمحت."}, {"sam": "Sure. Anything to drink?", "ar": "أكيد. شي تشربو؟", "model": "Just water, thanks.", "modelAr": "بس مي، شكراً."}, {"sam": "How is your food?", "ar": "كيف الأكل؟", "model": "It's delicious, thank you.", "modelAr": "طيب كتير، شكراً."}, {"sam": "Would you like some dessert?", "ar": "بتحب شي حلو؟", "model": "No, thanks. Could I get the check, please?", "modelAr": "لا شكراً. فيني آخد الحساب لو سمحت؟"}, {"sam": "Of course. Cash or card?", "ar": "أكيد. كاش ولا بطاقة؟", "model": "Card, please.", "modelAr": "بطاقة، لو سمحت."}]}, {"name": "مقابلة شغل 💼", "turns": [{"sam": "Hello! Please, have a seat. Tell me about yourself.", "ar": "أهلاً! تفضل اقعد. احكيلي عن حالك.", "model": "I'm an accounting student. I'm in my fourth year.", "modelAr": "أنا طالب محاسبة. بسنة رابعة."}, {"sam": "Why do you want this job?", "ar": "ليش بدك هالشغلة؟", "model": "I want to gain experience in a big company.", "modelAr": "بدي اكتسب خبرة بشركة كبيرة."}, {"sam": "What are your strengths?", "ar": "شو نقاط قوتك؟", "model": "I'm organized, and I learn quickly.", "modelAr": "أنا منظّم، وبتعلّم بسرعة."}, {"sam": "Can you use Excel?", "ar": "بتعرف تستعمل إكسل؟", "model": "Yes, I can. I use it a lot at university.", "modelAr": "إي بعرف. بستعملو كتير بالجامعة."}, {"sam": "Where do you see yourself in five years?", "ar": "وين بتشوف حالك بعد خمس سنين؟", "model": "I see myself as a senior accountant.", "modelAr": "بشوف حالي محاسب أول (خبير)."}, {"sam": "Do you have any questions for me?", "ar": "عندك أسئلة إلي؟", "model": "Yes. What are the working hours?", "modelAr": "إي. شو ساعات الدوام؟"}]}, {"name": "السفر ✈️", "turns": [{"sam": "Hello! Can I see your passport, please?", "ar": "مرحبا! فيني شوف جوازك لو سمحت؟", "model": "Sure. Here you go.", "modelAr": "أكيد. تفضل."}, {"sam": "Where are you flying today?", "ar": "لوين مسافر اليوم؟", "model": "I'm flying to Madrid.", "modelAr": "مسافر على مدريد."}, {"sam": "Are you checking any bags?", "ar": "عندك شنط للشحن؟", "model": "Yes, just one bag.", "modelAr": "إي، شنطة وحدة بس."}, {"sam": "Would you like a window or an aisle seat?", "ar": "بدك مقعد جنب الشباك ولا عالممر؟", "model": "A window seat, please.", "modelAr": "جنب الشباك لو سمحت."}, {"sam": "Welcome to our hotel! Do you have a reservation?", "ar": "أهلاً بفندقنا! عندك حجز؟", "model": "Yes, I have a reservation for three nights.", "modelAr": "إي، عندي حجز لتلت ليالي."}, {"sam": "Here's your key. Do you have any questions?", "ar": "هي مفتاحك. عندك أي سؤال؟", "model": "Yes. Is breakfast included?", "modelAr": "إي. الفطور ضمن السعر؟"}]}, {"name": "التسوق 🛍️", "turns": [{"sam": "Hi there! Can I help you?", "ar": "أهلين! فيني ساعدك؟", "model": "I'm just looking, thanks.", "modelAr": "عم اتفرج بس، شكراً."}, {"sam": "This jacket is very popular. Do you want to try it on?", "ar": "هالجاكيت مطلوب كتير. بدك تجربها؟", "model": "Yes, please. Do you have it in a medium?", "modelAr": "إي لو سمحت. عندك ياها قياس وسط؟"}, {"sam": "Here you go. How does it fit?", "ar": "تفضل. كيف جاية عليك؟", "model": "It fits well. How much is it?", "modelAr": "جاية مظبوط. قديش حقها؟"}, {"sam": "It's forty euros.", "ar": "حقها أربعين يورو.", "model": "OK, I'll take it.", "modelAr": "تمام، باخدها."}, {"sam": "Great! Cash or card?", "ar": "ممتاز! كاش ولا بطاقة؟", "model": "Card, please.", "modelAr": "بطاقة لو سمحت."}, {"sam": "Here's your bag. Have a nice day!", "ar": "هي كيسك. نهارك سعيد!", "model": "Thanks, you too!", "modelAr": "شكراً، وإنت كمان!"}]}];
const NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","13":"thirteen","30":"thirty","50":"fifty","oh":"oh"};
const CONTR = {"i'm":"i am","you're":"you are","we're":"we are","it's":"it is","that's":"that is","i'll":"i will","you'll":"you will","i've":"i have","i'd":"i would","what's":"what is","here's":"here is","she's":"she is","can't":"cannot","doesn't":"does not","isn't":"is not","let's":"let us"};
function words(s){
  s = s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g," ");
  let out=[]; s.split(/\s+/).filter(Boolean).forEach(w=>{ w = NUM[w]||w; (CONTR[w]||w).split(" ").forEach(x=>out.push(x)); });
  return out;
}
function diff(a,b){ // LCS alignment
  const n=a.length,m=b.length,D=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const res=[];let i=0,j=0,extra=[];
  while(i<n){ if(j<m&&a[i]===b[j]){res.push({w:a[i],ok:true});i++;j++;extra=[];}
    else if(j<m&&D[i][j+1]>=D[i+1][j]){extra.push(b[j]);j++;}
    else{res.push({w:a[i],ok:false,heard:extra.join(" ")});extra=[];i++;} }
  return res;
}
function tipsFor(w, heard){
  const t=[], h=heard||"";
  if(/th/.test(w)) t.push(`<b>${w}</b>: صوت th، طلّع راس لسانك شوي بين سنانك ونفّخ. لا تقولها (ز) ولا (د) ولا (س).`);
  if(/p/.test(w) || (/b/.test(h) && /p/.test(w))) t.push(`<b>${w}</b>: حرف P بلا صوت بالحلق، سكّر شفافك وفجّر نفَس هوا. حط إيدك قدام تمك لازم تحس بالهوا. مو B.`);
  if(/v/.test(w)) t.push(`<b>${w}</b>: حرف V، سنانك الفوقانية على شفتك التحتانية مع اهتزاز (صوت). مو F.`);
  if(/^(st|sp|sk|sm|sn|sl|str|spr|sch)/.test(w)) t.push(`<b>${w}</b>: ابدأ بالـ S مباشرة، بلا ألف قبلها (مو إِسْ…).`);
  if(/^w/.test(w)) t.push(`<b>${w}</b>: حرف W، دوّر شفافك متل كأنك بدك تقول (أُو)، مو V.`);
  if(/r/.test(w)) t.push(`<b>${w}</b>: الـ R الإنكليزية ناعمة، لسانك ما بيلمس سقف الحلق ولا بيرجف. مو (ر) عربية قوية.`);
  if(/(ed|es|s)$/.test(w) && w.length>3) t.push(`<b>${w}</b>: لا تبلع آخر الكلمة، لفظ آخر حرف بوضوح.`);
  if(!t.length) t.push(`<b>${w}</b>: اسمعها لحالها بالزر ▶ وعيدها ٣ مرات ببطء، بعدين ركّبها بالجملة.`);
  return t;
}

const $=id=>document.getElementById(id);
const bot=$("bot");
let ti=0, step=-1, rec=null, voice=null;
const synth=window.speechSynthesis;
function pick(){ if(!synth) return; const v=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/Google|Samantha|Natural|Aria|Jenny/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null; }
if(synth){ pick(); synth.onvoiceschanged=pick; }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function st(cls,txt){ bot.classList.remove("talking","listening"); if(cls) bot.classList.add(cls); $("status").textContent=txt; }
function say(text,rate){
  return new Promise(res=>{
    if(!synth){ res(); return; }
    synth.cancel(); const u=new SpeechSynthesisUtterance(text);
    if(voice) u.voice=voice; u.lang=voice?voice.lang:"en-US"; u.rate=rate||parseFloat($("rate").value);
    st("talking","Sam عم يحكي…");
    u.onend=u.onerror=()=>{ st(null,"دورك! اضغط 🎙️ وجاوب"); res(); };
    synth.speak(u);
  });
}
function renderTopics(){
  $("topics").innerHTML=TOPICS.map((t,i)=>`<button class="chip ${i===ti?'on':''}" data-i="${i}">${esc(t.name)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ ti=+b.dataset.i; step=-1; renderTopics(); nextTurn(); });
}
function turn(){ return TOPICS[ti].turns[step]; }
function nextTurn(){
  step++;
  const T=TOPICS[ti];
  if(step>=T.turns.length){
    $("prog").textContent=""; $("samLine").textContent="Great job! 🎉 See you next time!";
    $("samAr").textContent="برافو! خلصت هالمحادثة. اختار موضوع تاني من فوق."; $("model").classList.remove("show");
    $("fb").classList.remove("show"); $("next").textContent="عيد من الأول ↺"; step=-1;
    say("Great job! See you next time!"); return;
  }
  const t=turn();
  $("prog").textContent=`${T.name} · ${step+1}/${T.turns.length}`;
  $("samLine").textContent=t.sam; $("samAr").textContent=t.ar;
  $("modelTxt").textContent=t.model; $("modelAr").textContent=t.modelAr;
  $("model").classList.remove("show"); $("fb").classList.remove("show");
  $("next").textContent="التالي ⏭";
  say(t.sam);
}
$("next").onclick=nextTurn;
$("again").onclick=()=>{ if(step>=0) say(turn().sam); };
$("slow").onclick=()=>{ if(step>=0) say(turn().sam,0.65); };
$("showModel").onclick=()=>{ if(step<0) return; $("model").classList.add("show"); say(turn().model,0.8); };
$("modelSay").onclick=()=>say(turn().model,0.8);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){ $("warn").style.display="block"; $("warn").innerHTML="المايك بيحتاج <b>Google Chrome</b> عالكمبيوتر أو أندرويد. افتح هالصفحة فيه."; }
$("mic").onclick=()=>{
  if(step<0){ nextTurn(); return; }
  if(!SR) return;
  if(rec){ try{rec.stop();}catch(e){} return; }
  synth&&synth.cancel();
  rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.maxAlternatives=5; rec.continuous=false;
  let finalAlts=null;
  $("mic").classList.add("on"); $("micLabel").textContent="عم اسمعك… احكي، ولما تخلص بيوقف لحالو"; st("listening","Sam عم يسمعك 👂");
  rec.onresult=e=>{
    const r=e.results[e.results.length-1];
    $("micLabel").textContent="🗣️ "+r[0].transcript;
    if(r.isFinal) finalAlts=[...r].map(a=>a.transcript);
  };
  rec.onerror=e=>{
    $("micLabel").textContent = e.error==="not-allowed"||e.error==="service-not-allowed" ? "المايك مسكّر: اضغط على 🔒 جنب العنوان فوق ← Microphone ← Allow، وحدّث الصفحة."
      : e.error==="no-speech" ? "ما سمعت شي 🙂 اضغط 🎙️ واحكي فوراً بصوت أوضح."
      : e.error==="network" ? "المايك بيحتاج إنترنت. تأكد من النت وجرّب كمان مرة."
      : "صار خطأ بالمايك ("+e.error+")، جرّب كمان مرة.";
  };
  rec.onend=()=>{
    rec=null; $("mic").classList.remove("on"); st(null,"دورك! اضغط 🎙️ وجاوب");
    if(finalAlts){ judge(finalAlts); $("micLabel").textContent="اضغط 🎙️ إذا بدك تعيد"; }
  };
  try{ rec.start(); }catch(e){ rec=null; $("mic").classList.remove("on"); }
};
const PRAISE=["Nice!","Great!","Good answer!","Well done!","Cool!","Perfect!"];
function judge(alts){
  const t=turn(), tw=words(t.model);
  let best=null;
  for(const a of alts){ const d=diff(tw,words(a)); const sc=d.filter(x=>x.ok).length/tw.length; if(!best||sc>best.sc) best={d,sc,txt:a}; }
  const heard=alts[0], nWords=words(heard).length;
  const fb=$("fb"); fb.classList.add("show");
  let h="";
  if(best.sc>=0.5){
    const pct=Math.round(best.sc*100);
    const v=pct>=90?"👏 ممتاز! لفظك واضح.":pct>=70?"👍 منيح! صلّح الكلمات الحمرا وعيد.":"🔁 قريب! اسمع الجواب ببطء وعيد.";
    h+=`<div><span class="score">${pct}%</span> · ${v}</div><div class="en" style="margin-top:8px;text-align:center">${best.d.map(x=>`<span class="w ${x.ok?'ok':(x.heard?'bad':'miss')}" title="${x.heard?'سمعتها: '+esc(x.heard):''}">${esc(x.w)}</span>`).join(" ")}</div>`;
    const tips=[]; best.d.filter(x=>!x.ok).forEach(x=>tipsFor(x.w,x.heard).forEach(s=>{ if(!tips.includes(s)) tips.push(s); }));
    if(tips.length && pct<90) h+=`<ul class="tips">${tips.slice(0,3).map(s=>`<li>${s}</li>`).join("")}</ul>`;
    h+=`<div style="color:var(--mute);font-size:.88rem;margin-top:6px">أنا سمعت: <span class="en" style="display:inline">${esc(best.txt)}</span></div>`;
    fb.innerHTML=h;
    if(pct>=70) say(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
  } else {
    h+=`<div>👂 Sam سمعك عم تقول:</div><div class="en" style="font-size:1.1rem;font-weight:700;text-align:center;margin:6px 0">"${esc(heard)}"</div>`;
    h+= nWords>=3 ? `<div>👍 حلو إنك جاوبت بكلامك! إذا هاد يلي قصدتو، معناها لفظك مفهوم.</div>` : `<div>🙂 جاوب بجملة أطول شوي (٣ كلمات أو أكتر).</div>`;
    h+=`<div class="fix">🔁 هلق جرّب قول هالجواب، وأنا بصحّحلك لفظو كلمة كلمة:<div class="en" style="text-align:center;margin-top:4px">${esc(t.model)}</div><div class="row"><button class="btn" id="fbSay">🔊 اسمعو</button></div></div>`;
    fb.innerHTML=h; $("fbSay").onclick=()=>say(t.model,0.8);
    if(nWords>=3) say(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
  }
}
renderTopics();
$("samLine").textContent="Hi! I'm Sam 🤖"; $("samAr").textContent="اختار موضوع من فوق، أو اضغط ابدأ.";
</script>
